    function selectJobPurpose(jobTitle) {
      document.getElementById('purpose').value = "Job";

    }

    function updateSpecificFieldLabel() {
      const purpose = document.getElementById('purpose').value;
      const label = document.getElementById('labelSpecificField');
      const input = document.getElementById('specificField');
      if (purpose === 'Job') {
        label.innerText = "Desired Job Title / Position";
        input.placeholder = "e.g., Software Engineer, Nurse";
      } else if (purpose === 'Education') {
        label.innerText = "Desired Course / Field of Study";
        input.placeholder = "e.g., Bachelor's in IT, Master's in Business";
      } else {
        label.innerText = "Specific Job Title or Course of Study";
        input.placeholder = "Enter your desired field";
      }
    }

    // Form Submission & Duplicate Prevention + WhatsApp Redirect
    async function handleRegistration(event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const originCountry = document.getElementById('originCountry').value;
      const targetCountry = document.getElementById('targetCountry').value;
      const purpose = document.getElementById('purpose').value;
      const specificField = document.getElementById('specificField').value;
      const notes = document.getElementById('notes').value;

      if (localStorage.getItem('skyline_registered') === 'true') {
        alert("You have already submitted an application! You cannot register twice. Redirecting you to WhatsApp support.");
        window.location.href = "https://wa.me/251900000000?text=I%20have%20filled%20the%20form%20and%20what%20is%20the%20next%20step%20to%20follow%20the%20process%3F";
        return;
      }

      const formData = { fullName, email, phone, originCountry, targetCountry, purpose, specificField, notes };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok) {
          localStorage.setItem('skyline_registered', 'true');
          alert("Registration successful! Redirecting to WhatsApp...");
          const whatsappMsg = encodeURIComponent("I have filled the form and what is the next step to follow the process?");
          window.location.href = `https://wa.me/251900000000?text=${whatsappMsg}`;
        } else {
          alert(result.error || "Registration failed. Please try again.");
        }
      } catch (err) {
        console.error(err);
        alert("Network error. Please check your connection.");
      }
    }
