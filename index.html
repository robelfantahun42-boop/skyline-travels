<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyline Travels & Educational Consultancy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      overflow-x: hidden;
    }

    /* Top Bar */
    .top-bar {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 10px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 1px solid #1e293b;
    }

    .top-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .top-info a {
      color: #25d366;
      text-decoration: none;
      font-weight: 600;
    }

    /* Prominent Language Selector */
    .lang-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 99, 235, 0.2);
      border: 1.5px solid #2563eb;
      padding: 5px 12px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
    }

    .lang-container i {
      color: #60a5fa;
      font-size: 14px;
    }

    .lang-select {
      background: transparent;
      color: #ffffff;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .lang-select option {
      background: #0f172a;
      color: #ffffff;
    }

    /* Header & Mobile Menu Setup */
    header {
      background: #ffffff;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: #2563eb;
    }

    /* Hamburger Menu Button */
    .menu-btn {
      font-size: 24px;
      color: #0f172a;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
    }

    /* Dropdown Nav Styling */
    nav {
      display: none;
      position: absolute;
      top: 100%;
      right: 5%;
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-radius: 12px;
      width: 220px;
      flex-direction: column;
      padding: 10px 0;
      border: 1px solid #e2e8f0;
    }

    nav.active {
      display: flex;
    }

    nav a {
      padding: 12px 20px;
      text-decoration: none;
      color: #334155;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s, color 0.2s;
    }

    nav a:hover {
      background: #f1f5f9;
      color: #2563eb;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.88)), url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1200') center/cover no-repeat;
      color: #fff;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .hero p {
      font-size: 15px;
      max-width: 600px;
      margin: 0 auto 25px auto;
      color: #cbd5e1;
      line-height: 1.5;
    }

    /* WhatsApp Box */
    .whatsapp-display-box {
      background: rgba(37, 211, 102, 0.15);
      border: 2px solid #25d366;
      border-radius: 12px;
      padding: 12px 20px;
      display: inline-block;
      margin-bottom: 20px;
      max-width: 100%;
