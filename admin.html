<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Travels - Admin Dashboard</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 1.5rem;
            color: #0f172a;
        }
        header h1 i {
            color: #0284c7;
            margin-right: 10px;
        }
        .logout-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
        /* Settings Section for Contact info */
        .settings-card {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .admin-control-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .admin-control-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 8px;
            outline: none;
        }
        .save-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .save-btn:hover {
            background-color: #0369a1;
        }
        /* Table Section */
        .table-card {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        .table-card h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #334155;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }
        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        @media (max-width: 768px) {
            .settings-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1><i class="fa-solid fa-gauge-high"></i> Skyline Travels Admin Dashboard</h1>
            <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
        </header>

        <!-- Contact Settings Panel (WhatsApp & Telegram) -->
        <div class="settings-card">
            <!-- WhatsApp Setting -->
            <div class="admin-control-group">
                <label for="adminWhatsapp">
                    <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> WhatsApp Number/Link:
                </label>
                <input type="text" id="adminWhatsapp" placeholder="ለምሳሌ፡ 251911000000">
                <button class="save-btn" onclick="updateWhatsApp()">Update WhatsApp</button>
            </div>

            <!-- Telegram Setting -->
            <div class="admin-control-group">
                <label for="adminTelegram">
                    <i class="fa-brands fa-telegram" style="color: #229ED9;"></i> Telegram Username / Link:
                </label>
                <input type="text" id="adminTelegram" placeholder="ለምሳሌ፡ myusername ወይም ሙሉ ሊንክ">
                <button class="save-btn" onclick="updateTelegram()" style="background-color: #229ED9;">Update Telegram</button>
            </div>
        </div>

        <!-- Registrations Data Table -->
        <div class="table-card">
            <h2>Recent Job & Visa Registrations</h2>
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Job Category</th>
                        <th>Telegram User</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="registrationsTableBody">
                    <!-- Dynamic Data will be loaded here -->
                    <tr>
                        <td colspan="6" style="text-align: center; color: #64748b;">Loading registrations...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ገጹ ሲከፈት ነባር መረጃዎችን እና ሴቲንጎችን በራስ-ሰር መጫን
        document.addEventListener("DOMContentLoaded", () => {
            loadRegistrations();
            loadSettings();
        });

        // የተመዝጋቢዎችን መረጃ ከሰርቨር ማምጣት
        function loadRegistrations() {
            fetch('/api/admin/applications')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('registrationsTableBody');
                    tbody.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${item.fullName || 'N/A'}</td>
                                <td>${item.phone || 'N/A'}</td>
                                <td>${item.email || 'N/A'}</td>
                                <td>${item.jobCategory || 'N/A'}</td>
                                <td>${item.telegramUser || 'N/A'}</td>
                                <td>${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : 'N/A'}</td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b;">No registrations found.</td></tr>`;
                    }
                })
                .catch(err => {
                    console.error('Error loading registrations:', err);
                });
        }

        // ነባር የዋትሳፕ እና የቴሌግራም ሴቲንጎችን ከሰርቨር አምጥቶ በቦታው ማስገባት
        function loadSettings() {
            fetch('/api/settings')
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        if (data.whatsapp) {
                            document.getElementById('adminWhatsapp').value = data.whatsapp;
                        }
                        if (data.telegram) {
                            document.getElementById('adminTelegram').value = data.telegram;
                        }
                    }
                })
                .catch(err => console.log('Error loading settings:', err));
        }

        // የዋትሳፕ ቁጥር ማስተካከል
        function updateWhatsApp() {
            const whatsappNumber = document.getElementById('adminWhatsapp').value;
            fetch('/api/admin/settings/whatsapp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ whatsappNumber: whatsappNumber })
            })
            .then(res => res.json())
            .then(response => {
                if (response.success) {
                    alert('WhatsApp updated successfully!');
                } else {
                    alert('Failed to update WhatsApp');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Failed to update WhatsApp');
            });
        }

        // የቴሌግራም ዩዘርና ማስተካከል
        function updateTelegram() {
            const telegramUsername = document.getElementById('adminTelegram').value;
            fetch('/api/admin/settings/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramUsername: telegramUsername })
            })
            .then(res => res.json())
            .then(response => {
                if (response.success) {
                    alert('Telegram updated successfully!');
                } else {
                    alert('Failed to update Telegram');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Failed to update Telegram');
            });
        }

        // Logout function
        function logoutAdmin() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/admin.html';
                });
        }
    </script>
</body>
</html>
