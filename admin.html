<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Travels - Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 25px; color: #fff; font-size: 24px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        input { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 15px; }
        input:focus { outline: none; border-color: #2563eb; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 8px; font-weight: 700; font-size: 15px; transition: background 0.3s; margin-right: 10px; }
        button:hover { background: #1d4ed8; }
        .status-msg { margin-top: 10px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Dashboard - Skyline Travels</h2>
        
        <!-- WhatsApp Settings -->
        <div class="input-group">
            <label>WhatsApp Full Link / Number:</label>
            <input type="text" id="whatsappInput" placeholder="e.g. https://wa.me/251911000000">
            <button onclick="updateWhatsApp()" style="margin-top: 10px;">Update WhatsApp</button>
            <span id="waStatus" class="status-msg"></span>
        </div>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 30px 0;">

        <!-- Telegram Settings -->
        <div class="input-group">
            <label>Telegram Full Link / Username:</label>
            <input type="text" id="telegramInput" placeholder="e.g. https://t.me/Lubi1331">
            <button onclick="updateTelegram()" style="margin-top: 10px;">Update Telegram</button>
            <span id="tgStatus" class="status-msg"></span>
        </div>
    </div>

    <script>
        // ገጹ ሲከፈት ከዳታቤዝ አሁን ያሉትን መረጃዎች አምጥቶ በሳጥኖቹ ላይ ይሞላል
        window.onload = async function() {
            try {
                const response = await fetch('/api/settings');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('whatsappInput').value = data.whatsapp || '';
                    document.getElementById('telegramInput').value = data.telegram || '';
                }
            } catch (error) {
                console.error("Error loading settings:", error);
            }
        };

        // ዋትሳፕን ብቻ ለማስተካከል
        async function updateWhatsApp() {
            const whatsappNumber = document.getElementById('whatsappInput').value.trim();
            const statusEl = document.getElementById('waStatus');

            try {
                const response = await fetch('/api/admin/settings/whatsapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ whatsappNumber })
                });

                const result = await response.json();
                if (response.ok) {
                    statusEl.style.color = '#22c55e';
                    statusEl.innerText = 'WhatsApp updated successfully!';
                    setTimeout(() => statusEl.innerText = '', 3000);
                } else {
                    throw new Error(result.error || 'Failed');
                }
            } catch (error) {
                statusEl.style.color = '#ef4444';
                statusEl.innerText = 'Error updating WhatsApp.';
            }
        }

        // ቴሌግራምን ብቻ ለማስተካከል (ከለክህ ጋር በተጣጣመ መልኩ ዩዘርነሙን ይልካል)
        async function updateTelegram() {
            const telegramUsername = document.getElementById('telegramInput').value.trim();
            const statusEl = document.getElementById('tgStatus');

            try {
                const response = await fetch('/api/admin/settings/telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramUsername })
                });

                const result = await response.json();
                if (response.ok) {
                    statusEl.style.color = '#22c55e';
                    statusEl.innerText = 'Telegram updated successfully!';
                    setTimeout(() => statusEl.innerText = '', 3000);
                } else {
                    throw new Error(result.error || 'Failed');
                }
            } catch (error) {
                statusEl.style.color = '#ef4444';
                statusEl.innerText = 'Error updating Telegram.';
            }
        }
    </script>
</body>
</html>
