<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Travels - Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Login Card Styling */
        #login-section {
            max-width: 400px;
            margin: 80px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
        }
        #login-section h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #0369a1;
        }

        /* Dashboard Layout */
        #dashboard-section {
            display: none;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 24px;
            color: #38bdf8;
        }
        .btn-logout {
            background: #ef4444;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
        }
        .btn-logout:hover {
            background: #dc2626;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #f1f5f9;
            font-size: 18px;
        }

        /* WhatsApp Form */
        .whatsapp-form {
            display: flex;
            gap: 10px;
            max-width: 500px;
        }
        .whatsapp-form input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
        }
        .whatsapp-form button {
            width: auto;
            padding: 10px 20px;
        }

        /* Applications Table */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
        }
        tr:hover {
            background-color: #273549;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background: #0369a1;
            color: #e0f2fe;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. LOGIN SECTION -->
        <div id="login-section">
            <h2>Skyline Admin Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">የተጠቃሚ ስም (Username)</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">የይለፍ ቃል (Password)</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">ይግቡ (Login)</button>
                <p id="loginError" style="color: #ef4444; margin-top: 10px; display: none; font-size: 14px;"></p>
            </form>
        </div>

        <!-- 2. DASHBOARD SECTION -->
        <div id="dashboard-section">
            <header>
                <h1>Skyline Travels - Admin Dashboard</h1>
                <button class="btn btn-logout" onclick="handleLogout()">ውጣ (Logout)</button>
            </header>

            <!-- WhatsApp Settings Card -->
            <div class="card">
                <h3>የ WhatsApp ስልክ ቁጥር ማስተካከያ</h3>
                <p style="color: #94a3b8; font-size: 13px; margin-bottom: 12px;">
                    በዌብሳይቱ ላይ ደንበኞች የሚያዩትን የ WhatsApp ቁጥር እዚህ ይለውጡ (ምሳሌ: 251912345678)
                </p>
                <div class="whatsapp-form">
                    <input type="text" id="waNumberInput" placeholder="2519xxxxxxxx">
                    <button class="btn" onclick="updateWhatsAppNumber()">አዝምን (Save)</button>
                </div>
                <p id="waMsg" style="margin-top: 8px; font-size: 13px; font-weight: bold;"></p>
            </div>

            <!-- Applications List Card -->
            <div class="card">
                <h3>የተላኩ ማመልከቻዎች (Submitted Applications)</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ቀን</th>
                                <th>ሙሉ ስም</th>
                                <th>ስልክ ቁጥር</th>
                                <th>ኢሜይል</th>
                                <th>የሥራ መደብ</th>
                                <th>መልእክት</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: #94a3b8;">ዳታ እየተጫነ ነው...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // On Page Load: Check authentication status
        document.addEventListener('DOMContentLoaded', checkSession);

        async function checkSession() {
            try {
                const res = await fetch('/api/admin/check-session');
                const data = await res.json();
                if (data.isAuthenticated) {
                    showDashboard();
                } else {
                    showLogin();
                }
            } catch (e) {
                showLogin();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    showDashboard();
                } else {
                    errorEl.textContent = data.message || 'መግባት አልተቻለም';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'የሰርቨር ስህተት ተፈጥሯል!';
                errorEl.style.display = 'block';
            }
        }

        async function handleLogout() {
            await fetch('/api/admin/logout', { method: 'POST' });
            showLogin();
        }

        function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            loadApplications();
            loadWhatsAppNumber();
        }

        function showLogin() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('dashboard-section').style.display = 'none';
        }

        async function loadWhatsAppNumber() {
            try {
                const res = await fetch('/api/settings/whatsapp');
                const data = await res.json();
                if (data.whatsappNumber) {
                    document.getElementById('waNumberInput').value = data.whatsappNumber;
                }
            } catch (e) {
                console.error("Failed to load WhatsApp number", e);
            }
        }

        async function updateWhatsAppNumber() {
            const number = document.getElementById('waNumberInput').value;
            const msgEl = document.getElementById('waMsg');
            if (!number) return alert('እባክዎን ስልክ ቁጥር ያስገቡ');

            try {
                const res = await fetch('/api/admin/settings/whatsapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ whatsappNumber: number })
                });
                const data = await res.json();
                if (data.success) {
                    msgEl.style.color = '#4ade80';
                    msgEl.textContent = data.message;
                } else {
                    msgEl.style.color = '#ef4444';
                    msgEl.textContent = data.message || 'ማስተካከል አልተቻለም';
                }
            } catch (e) {
                msgEl.style.color = '#ef4444';
                msgEl.textContent = 'ስህተት ተፈጥሯል!';
            }
        }

        async function loadApplications() {
            const tbody = document.getElementById('applicationsTableBody');
            try {
                const res = await fetch('/api/admin/applications');
                const data = await res.json();
                if (data.success && data.applications.length > 0) {
                    tbody.innerHTML = data.applications.map(app => `
                        <tr>
                            <td>${new Date(app.createdAt).toLocaleDateString()}</td>
                            <td><strong>${escapeHtml(app.fullName)}</strong></td>
                            <td>${escapeHtml(app.phone)}</td>
                            <td>${escapeHtml(app.email)}</td>
                            <td><span class="status-badge">${escapeHtml(app.position)}</span></td>
                            <td>${escapeHtml(app.message || '-')}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #94a3b8;">ምንም የተላከ ማመልከቻ የለም።</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444;">መረጃውን መጫን አልተቻለም።</td></tr>';
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
