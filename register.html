<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job & Visa Registration - Skyline Travels</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .register-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .register-container h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #2980b9;
        }
        #responseMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2><i class="fa-solid fa-file-lines" style="color: #3498db;"></i> Job & Visa Application Form</h2>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" required placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label for="nationality">Nationality (Origin Country)</label>
                <input type="text" id="nationality" required placeholder="e.g. Ethiopian">
            </div>

            <div class="form-group">
                <label for="targetCountry">Target Country</label>
                <input type="text" id="targetCountry" required placeholder="e.g. Canada, USA, Germany">
            </div>

            <div class="form-group">
                <label for="category">Job Category</label>
                <input type="text" id="category" required placeholder="e.g. Construction, IT, Hospitality">
            </div>

            <div class="form-group">
                <label for="education">Education Level</label>
                <input type="text" id="education" required placeholder="e.g. Bachelor Degree, High School">
            </div>

            <div class="form-group">
                <label for="message">Notes / Message (Optional)</label>
                <textarea id="message" placeholder="Any additional information..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Application</button>
            <div id="responseMessage"></div>
        </form>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const responseMessage = document.getElementById('responseMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            responseMessage.style.color = '#333';
            responseMessage.textContent = '';

            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                nationality: document.getElementById('nationality').value.trim(),
                targetCountry: document.getElementById('targetCountry').value.trim(),
                category: document.getElementById('category').value.trim(),
                education: document.getElementById('education').value.trim(),
                message: document.getElementById('message').value.trim()
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    responseMessage.style.color = '#27ae60';
                    responseMessage.textContent = 'Application submitted successfully!';
                    document.getElementById('registrationForm').reset();
                } else {
                    responseMessage.style.color = '#e74c3c';
                    responseMessage.textContent = data.error || 'Something went wrong. Please try again.';
                }
            } catch (err) {
                console.error('Error:', err);
                responseMessage.style.color = '#e74c3c';
                responseMessage.textContent = 'Connection error. Please check your network.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Application';
            }
        });
    </script>
</body>
</html>
