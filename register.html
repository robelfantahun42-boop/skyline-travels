<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form - Skyline Travels</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .form-card {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      padding: 40px;
      position: relative;
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header h2 {
      font-size: 24px;
      color: #0f172a;
      font-weight: 800;
      margin-top: 10px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
      margin-top: 5px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .back-link i {
      margin-right: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
      color: #0f172a;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    .submit-btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    /* Success Overlay Modal replacing form area */
    .success-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 16px;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .success-overlay i.fa-circle-check {
      font-size: 64px;
      color: #22c55e;
      margin-bottom: 15px;
    }

    .success-overlay h2 {
      font-size: 26px;
      color: #0f172a;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .success-overlay p {
      font-size: 16px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .admin-whatsapp-box {
      background: #f0fdf4;
      border: 2px solid #22c55e;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #166534;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .admin-whatsapp-box i {
      font-size: 24px;
      color: #25d366;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <!-- Success Overlay Screen that covers the form completely -->
    <div id="successOverlay" class="success-overlay">
      <i class="fa-solid fa-circle-check"></i>
      <h2>ምዝገባህን ጨርሰሃል! እንኳን ደስ አለህ!</h2>
      <p>ቀሪውን የቪዛ እና የጉዞ ፕሮሰስ ለመከታተል እባክዎ ከታች ባለው የዋትሰድ ቁጥር የደንበኞች አገልግሎትን በአስቸኳይ ያነጋግሩ።</p>
      <a id="adminWaBtn" href="#" target="_blank" class="admin-whatsapp-box">
        <i class="fa-brands fa-whatsapp"></i> <span id="adminWaText">+251 900 000 000</span>
      </a>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    
    <div class="form-header">
      <i class="fa-solid fa-passport" style="font-size: 36px; color: #2563eb;"></i>
      <h2>Global Opportunity Application</h2>
      <p>Fill out your comprehensive details to apply for international jobs or scholarships.</p>
    </div>

    <form id="applyForm">
      <!-- Full Name (No placeholder hints) -->
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>

      <!-- Row: Email & Phone -->
      <div class="form-row">
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone / WhatsApp Number *</label>
          <input type="text" id="phone" name="phone" required>
        </div>
      </div>

      <!-- Row: Nationality & Target Country -->
      <div class="form-row">
        <div class="form-group">
          <label for="nationality">Your Nationality *</label>
          <select id="nationality" name="nationality" required>
            <option value="">-- Select Country --</option>
            <option value="Ethiopian">Ethiopian</option>
            <option value="Kenyan">Kenyan</option>
            <option value="Eritrean">Eritrean</option>
            <option value="Somali">Somali</option>
            <option value="Sudanese">Sudanese</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="targetCountry">Target Destination Country *</label>
          <select id="targetCountry" name="targetCountry" required>
            <option value="">-- Select Destination --</option>
            <option value="Canada">Canada</option>
            <option value="USA">USA</option>
            <option value="Germany">Germany</option>
            <option value="UK">UK</option>
            <option value="Australia">Australia</option>
            <option value="Japan">Japan</option>
            <option value="Middle East">Middle East</option>
            <option value="Other Europe">Other Europe</option>
          </select>
        </div>
      </div>

      <!-- Row: Category (Job / Scholarship) & Education Level -->
      <div class="form-row">
        <div class="form-group">
          <label for="category">Application Category *</label>
          <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Job Opportunity">Job Opportunity (ስራ)</option>
            <option value="Scholarship">Educational Scholarship (ስኮላርሺፕ)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="education">Highest Education Level *</label>
          <select id="education" name="education" required>
            <option value="High School">High School</option>
            <option value="Diploma">Diploma / TVET</option>
            <option value="Bachelor Degree">Bachelor's Degree</option>
            <option value="Master Degree">Master's Degree</option>
            <option value="PhD">PhD</option>
          </select>
        </div>
      </div>

      <!-- Additional Info -->
      <div class="form-group">
        <label for="message">Additional Information / Work Experience</label>
        <textarea id="message" name="message"></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Application</button>
    </form>
  </div>

  <script>
    // Load Admin WhatsApp setting dynamically to show big on completion board
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        if (settings.whatsapp) {
          const waBtn = document.getElementById('adminWaBtn');
          const waText = document.getElementById('adminWaText');
          waBtn.href = `https://wa.me/${settings.whatsapp}`;
          waText.textContent = `+${settings.whatsapp}`;
        }
      } catch (e) {
        // Fallback default
        document.getElementById('adminWaBtn').href = `https://wa.me/251900000000`;
      }
    });

    document.getElementById('applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        nationality: document.getElementById('nationality').value,
        targetCountry: document.getElementById('targetCountry').value,
        category: document.getElementById('category').value,
        education: document.getElementById('education').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok) {
          // Show the big full-card success overlay covering the form
          document.getElementById('successOverlay').style.display = 'flex';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          alert(result.message || 'ይህ ስልክ ቁጥር ቀድሞውኑ ተመዝግቧል! በአንድ ስልክ ቁጥር ከአንድ ጊዜ በላይ መመዝገብ አይቻልም።');
        }
      } catch (err) {
        alert('የኔትወርክ ስህተት ተፈጥሯል። እባክዎ እንደገና ይሞክሩ።');
      }
    });
  </script>
</body>
</html>
