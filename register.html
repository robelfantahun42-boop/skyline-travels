<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form - Skyline Travels</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #38bdf8 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .form-card {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 45px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative top colorful header banner */
    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #f59e0b, #ef4444, #8b5cf6, #3b82f6, #10b981);
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      color: #2563eb;
      border-radius: 50%;
      margin-bottom: 12px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.15);
    }

    .form-header h2 {
      font-size: 26px;
      color: #0f172a;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
      margin-top: 6px;
    }

    /* Big and colorful Back to Home button */
    .back-btn-container {
      margin-bottom: 25px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #eff6ff;
      color: #2563eb;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border: 1.5px solid #bfdbfe;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
      transform: translateY(-2px);
    }

    /* Success Overlay Modal replacing form area */
    .success-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 20px;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-overlay i.fa-circle-check {
      font-size: 72px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      filter: drop-shadow(0 8px 16px rgba(34, 197, 94, 0.3));
    }

    .success-overlay h2 {
      font-size: 28px;
      color: #0f172a;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .success-overlay p {
      font-size: 16px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .admin-whatsapp-box {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 2px solid #22c55e;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 800;
      color: #166534;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.2);
      transition: transform 0.2s ease;
    }

    .admin-whatsapp-box:hover {
      transform: scale(1.03);
    }

    .admin-whatsapp-box i {
      font-size: 28px;
      color: #25d366;
    }

    @media (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .form-card {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="form-card">
    <!-- Success Overlay Screen -->
    <div id="successOverlay" class="success-overlay">
      <i class="fa-solid fa-circle-check"></i>
      <h2>ምዝገባህን ጨርሰሃል! እንኳን ደስ አለህ!</h2>
      <p>ቀሪውን የቪዛ እና የጉዞ ፕሮሰስ ለመከታተል እባክዎ ከታች ባለው የዋትስአፕ ቁጥር የደንበኞች አገልግሎትን በአስቸኳይ ያነጋግሩ።</p>
      <a id="adminWaBtn" href="#" target="_blank" class="admin-whatsapp-box">
        <i class="fa-brands fa-whatsapp"></i> <span id="adminWaText">+251 900 000 000</span>
      </a>
    </div>

    <!-- Back to Home Button -->
    <div class="back-btn-container">
      <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left-long"></i> Back to Home</a>
    </div>
    
    <div class="form-header">
      <div class="icon-box">
        <i class="fa-solid fa-passport" style="font-size: 30px;"></i>
      </div>
      <h2>Global Opportunity Application</h2>
      <p>Fill out your comprehensive details to apply for international jobs or scholarships.</p>
    </div>

    <form id="applyForm">
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>

      <!-- Row: Email & Phone -->
      <div class="form-row">
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone / WhatsApp Number *</label>
          <input type="text" id="phone" name="phone" required>
        </div>
      </div>

      <!-- Row: Nationality & Target Country -->
      <div class="form-row">
        <div class="form-group">
          <label for="nationality">Your Nationality *</label>
          <input type="text" id="nationality" name="nationality" required>
        </div>
        <div class="form-group">
          <label for="targetCountry">Target Destination Country *</label>
          <input type="text" id="targetCountry" name="targetCountry" required>
        </div>
      </div>

      <!-- Row: Category & Education Level -->
      <div class="form-row">
        <div class="form-group">
          <label for="category">Application Category *</label>
          <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Job Opportunity">Job Opportunity</option>
            <option value="Scholarship">Educational Scholarship</option>
          </select>
        </div>
        <div class="form-group">
          <label for="education">Highest Education Level *</label>
          <select id="education" name="education" required>
            <option value="High School">High School</option>
            <option value="Diploma">Diploma / TVET</option>
            <option value="Bachelor Degree">Bachelor's Degree</option>
            <option value="Master Degree">Master's Degree</option>
            <option value="PhD">PhD</option>
          </select>
        </div>
      </div>

      <!-- Additional Info -->
      <div class="form-group">
        <label for="message">Additional Information / Work Experience</label>
        <textarea id="message" name="message"></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Application</button>
    </form>
  </div>

  <script>
    // Load Admin WhatsApp setting dynamically
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        if (settings.whatsapp) {
          const waBtn = document.getElementById('adminWaBtn');
          const waText = document.getElementById('adminWaText');
          waBtn.href = `https://wa.me/${settings.whatsapp}`;
          waText.textContent = `+${settings.whatsapp}`;
        }
      } catch (e) {
        document.getElementById('adminWaBtn').href = `https://wa.me/251900000000`;
      }
    });

    document.getElementById('applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        nationality: document.getElementById('nationality').value,
        targetCountry: document.getElementById('targetCountry').value,
        category: document.getElementById('category').value,
        education: document.getElementById('education').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok) {
          document.getElementById('successOverlay').style.display = 'flex';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          alert(result.message || 'ይህ ስልክ ቁጥር ቀድሞውኑ ተመዝግቧል! በአንድ ስልክ ቁጥር ከአንድ ጊዜ በላይ መመዝገብ አይቻልም።');
        }
      } catch (err) {
        alert('የኔትወርክ ስህተት ተፈጥሯል። እባክዎ እንደገና ይሞክሩ።');
      }
    });
  </script>
</body>
</html>
